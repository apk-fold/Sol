name: Build FoldBook APK

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.13'
      - name: Install Android SDK platform
        run: yes | sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - name: Run unit tests
        run: gradle testDebugUnitTest --no-daemon
      - name: Build debug APK
        run: gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v7
        with:
          name: foldbook-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Publish APK release
        if: github.event_name == 'push' && contains(github.event.head_commit.message, '[publish-apk]')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.1.0
          name: FoldBook v1.1.0 — APK debug
          body: |
            FoldBook v1.1.0 : correction de la résolution des chemins internes EPUB (noms encodés, chapitres et SVG) et adaptation aux changements de largeur de fenêtre sur appareils pliables.

            APK debug pour test : il n'est pas signé avec une clé de distribution Google Play. La compilation et les tests unitaires ont réussi dans GitHub Actions. Merci de signaler les problèmes avec le modèle d'appareil et la version Android.
          prerelease: true
          files: app/build/outputs/apk/debug/app-debug.apk
